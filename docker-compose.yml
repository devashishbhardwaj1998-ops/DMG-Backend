services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: dmg, POSTGRES_PASSWORD: "${DB_PASSWORD}", POSTGRES_DB: dmg}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U dmg"], interval: 5s, retries: 10}
  app:
    build: .
    env_file: .env
    environment: {DATABASE_URL: "postgresql+psycopg2://dmg:${DB_PASSWORD}@db:5432/dmg"}
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
    restart: unless-stopped
volumes: {pgdata: {}}

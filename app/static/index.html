<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMG Assignment Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;font:13px Inter,Segoe UI,Arial,sans-serif;background:#f4f6fa;color:#182033}
.side{position:fixed;inset:0 auto 0 0;width:220px;background:#101a2a;padding:16px 12px;color:#fff;overflow:auto}.side b{display:block;padding:6px 8px 14px;font-size:16px}
.side button{display:block;width:100%;text-align:left;background:none;border:0;color:#aebbd0;padding:10px;border-radius:8px;cursor:pointer;font:inherit}.side button.on,.side button:hover{background:#1a2940;color:#fff}
.me{margin-top:18px;font-size:11px;color:#9fb0c8;line-height:1.5}.me a{color:#8fb4ff}
.main{margin-left:220px;padding:22px 28px;max-width:1400px}h1{font-size:22px;margin:0 0 4px}h3{margin:18px 0 8px}.sub{color:#6c7788;font-size:12px;margin-bottom:14px}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}.card,.panel{background:#fff;border:1px solid #e1e6ee;border-radius:12px;padding:14px}
.card .n{font-size:24px;font-weight:800}.card .l{font-size:10px;text-transform:uppercase;color:#7b8594}.panel{margin-bottom:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse}th{font-size:10px;text-transform:uppercase;color:#7b8594;text-align:left}td,th{padding:8px;border-bottom:1px solid #eef1f6;vertical-align:top}
button.b{border:1px solid #dbe1ea;background:#fff;border-radius:8px;padding:7px 11px;font-weight:700;cursor:pointer}.p{background:#2f76e8;color:#fff;border-color:#2f76e8!important}.g{background:#17a36b;color:#fff;border-color:#17a36b!important}
button:disabled{opacity:.4;cursor:not-allowed}.big{padding:14px 26px;font-size:14px}input,select,textarea{padding:7px;border:1px solid #dbe1ea;border-radius:8px;font:inherit;margin:2px;max-width:100%}
.tag{background:#eaf1ff;color:#2c5fae;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;display:inline-block;margin:1px}.tag.o{background:#e7f7ef;color:#12724a}.tag.w{background:#fff4dd;color:#8a5a00}.tag.r{background:#fde8e8;color:#a32121}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mut{color:#8a94a6;font-size:11px}a.cms{color:#2f76e8;font-weight:700;text-decoration:none;white-space:nowrap}a.cms:hover{text-decoration:underline}
.chip{border:1px solid #cfd8e6;background:#fff;border-radius:20px;padding:4px 11px;cursor:pointer;font-weight:700;font-size:12px}.chip.on{background:#2f76e8;color:#fff;border-color:#2f76e8}
.warn{background:#fff4dd;border:1px solid #f0d9a4;color:#7a5200;border-radius:10px;padding:10px 12px;margin:10px 0}
.hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:-6px 0 16px;padding:8px 12px;background:#fff;border:1px solid #e1e6ee;border-radius:12px}
.brow{display:flex;align-items:center;gap:10px;margin:6px 0}.bl{width:150px;font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bt{flex:1;height:12px;background:#eef1f6;border-radius:8px;overflow:hidden}.bt i{display:block;height:100%;border-radius:8px}.bv{width:80px;text-align:right;font-weight:800;font-size:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}.chk{display:inline-flex;align-items:center;gap:4px;margin:2px 10px 2px 0;font-size:12px}
#toast{position:fixed;bottom:20px;right:20px;background:#182033;color:#fff;padding:12px 16px;border-radius:10px;display:none;max-width:420px;z-index:9}
@media(max-width:800px){.side{position:static;width:auto}.main{margin:0;padding:14px}}
</style></head><body>
<div class="side"><b>DMG Assignment Hub</b><div id="nav"></div><div class="me" id="who"></div></div>
<div class="main"><div class="hdr" id="hdr"></div><div id="c">Loading…</div></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id);let ME,CFG,page='dash',REG='',R=[];const NAVB={};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ref=o=>R.push(o)-1;
async function call(a,p){const r=await fetch('/api/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p||{})});
 if(r.status===401){location='/auth/login';return new Promise(()=>{})}let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||('Error '+r.status));return j}
function toast(m){$('toast').textContent=m;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',5000)}
async function run(a,p,msg){try{const r=await call(a,p);if(msg)toast(msg);await show(page);return r}catch(e){toast(e.message||e)}}
const cms=a=>a.cmsUrl?`<a class="cms" href="${esc(a.cmsUrl)}" target="_blank" rel="noopener noreferrer">Open in CMS ↗</a>`:'<span class="mut">no CMS link</span>';
const meta=a=>`<b>${esc(a.name)}</b><br><span class="mut">ID ${esc(a.id)} · ${esc(a.profileType)} · requested ${esc(a.requestDate)||'n/a'} · ${esc(a.ownership)}</span>`;
const rg=a=>`<span class="tag">${esc(a.region)}</span>`;
const tbl=(h,r)=>`<div class="panel"><table><tr>${h.map(x=>'<th>'+x+'</th>').join('')}</tr>${r.join('')||'<tr><td colspan='+h.length+' class="mut">Nothing here.</td></tr>'}</table></div>`;
const pages=()=>[['dash','My Work'],['search','Search'],['kpi','KPI'],['quality','Quality'],['proj','Projects'],['leave','Leave'],['notif','Alerts'],...(ME.isReviewer?[['review','Review Pipeline']]:[]),
 ...(ME.isAdmin?[['pipe','Pipeline'],['gaps',"Can't be taken"],['who','Who is on'],['stats','Team stats'],['over','Overview'],['team','Team'],['exp','Exports'],['audit','Audit Trail'],['set','Settings']]:[])];
function nav(){$('nav').innerHTML=pages().map(([k,t])=>`<button class="${k==page?'on':''}" onclick="show('${k}')">${t}${NAVB[k]?` <span class="tag r">${NAVB[k]}</span>`:''}</button>`).join('');
 $('who').innerHTML=`<b style="display:inline;padding:0;font-size:12px;color:#fff">${esc(ME.name)}</b><br>${esc(ME.title)}${ME.isReviewer&&!ME.isAdmin?' · Reviewer':''}${ME.isAdmin?' · Admin':''}<br>${ME.regions.map(r=>`<span class="tag">${esc(r)}</span>`).join('')||'<i>no region</i>'}<br><a href="/auth/logout">Sign out</a>`}
function regionBar(){if(ME.regions.length<2)return ME.regions.length?`<span class="mut">Region: <b>${esc(ME.regions[0])}</b></span>`:'';
 return `<label class="mut">Viewing <select onchange="REG=this.value;show(page)"><option value="">${ME.isAdmin?'All regions':'All my regions'}</option>${ME.regions.map(r=>`<option ${r===REG?'selected':''}>${esc(r)}</option>`).join('')}</select></label>`}
async function show(p){page=p;R=[];nav();$('c').innerHTML='Loading…';try{if(p==='dash'||p==='review'||p==='exp')CFG=(await call('boot')).cfg;await V[p]()}catch(e){$('c').innerHTML='<div class="panel">'+esc(e.message||e)+'</div>'}}
const calc=(Q,s)=>{const d=(s.ownDiff/Q.scale.ownDiff+s.typeDiff/Q.scale.typeDiff+s.txDiff/Q.scale.txDiff)/3,P={difficulty:d,accuracy:s.accuracy/Q.scale.accuracy,coverage:s.coverage/Q.scale.coverage,consistency:s.consistency/Q.scale.consistency,notesScore:s.notesScore/Q.scale.notesScore};
 let t=0,w=0;for(const k in P){const x=Number(Q.weights[k])||0;t+=x*P[k];w+=x}return{d:Math.round(d*100),pct:w?Math.round(t/w*100):0}};
const KS=['ownDiff','typeDiff','txDiff','accuracy','coverage','consistency','notesScore'],KL={ownDiff:'Ownership',typeDiff:'Type',txDiff:'Deals',accuracy:'Accuracy',coverage:'Coverage',consistency:'Consistency',notesScore:'CMS notes'};
const V={
async dash(){const d=await call('dashboard'),full=d.mine.length>=d.max,away=ME.availability!=='Available';
 $('c').innerHTML=`<div class="top"><div><h1>Hello, ${esc(ME.name.split(' ')[0])}</h1><div class="sub">Your own work only. You only receive assets from your region(s).</div></div>${regionBar()}</div>
 ${d.noRegion?(ME.isAdmin?'<div class="warn">Admins see every region on the Pipeline and Review pages. Add region(s) to your own profile on the Team page if you also want to pull work.</div>':'<div class="warn">No region is assigned to you yet. Ask an admin to add your region(s).</div>'):''}
 ${away?`<div class="warn">You are set to <b>${esc(ME.availability)}</b>, so Get Next is paused. Change it in the bar above.</div>`:''}
 <div class="panel row"><div style="flex:1"><b>My pipeline</b> <span class="tag">${d.mine.length} / ${d.max}</span><br><span class="mut">${full?'Pipeline full. Complete an asset first.':'Pull the next asset from your region queue.'}</span></div>
 <button class="b p big" ${full||d.noRegion||away?'disabled':''} onclick="run('getNext',{region:REG},'Asset assigned')">GET NEXT ASSET</button></div>
 <div class="cards">${card('Completed (all-time)',d.done)}${card('My pending reviews',d.pendingReviews)}${card('Available in my region(s)',d.available)}</div>`+
 tbl(['Asset','Region','Status','CMS','Finish it'],d.mine.map(a=>{const i=ref(a);return `<tr><td>${meta(a)}</td><td>${rg(a)}</td><td><span class="tag o">${esc(a.status)}</span></td><td>${cms(a)}</td>
 <td>${a.status=='Assigned'?`<button class="b" onclick="run('start',{id:R[${i}].id})">Start</button> `:''}<div class="row mut" style="margin:4px 0">Your difficulty reading:
 <label>Ownership <select id="u${i}_ownDiff">${nopt(CFG.qa.scale.ownDiff,CFG.qa.ownershipScore[a.ownership]||3)}</select></label><label>Type <select id="u${i}_typeDiff">${nopt(CFG.qa.scale.typeDiff,CFG.qa.typeScore[a.profileType]||5)}</select></label>
 <label>Deals <select id="u${i}_txDiff">${Object.entries(CFG.qa.dealsScore).map(([t,v])=>`<option value="${v}">${esc(t)}</option>`).join('')}</select></label></div><button class="b g" onclick="cp(${i})">Mark Complete</button></td></tr>`}))+
 '<h3>My QA history</h3>'+tbl(['Asset','QA %','Feedback'],d.qa.map(q=>`<tr><td>${esc(q.name)}</td><td><b>${q.pct}%</b></td><td>${esc(q.notes)}</td></tr>`))},
async review(){const d=await call('reviewQueue',{region:REG}),Q=d.qa,adm=ME.isAdmin;window.QAC=Q;
 const form=a=>{const i=ref(a),df={ownDiff:Q.ownershipScore[a.ownership]||3,typeDiff:Q.typeScore[a.profileType]||5},u=a.updReading;
  return `<div class="mut" style="margin-bottom:4px">Updater's reading: ${u?`Ownership ${u.own} · Type ${u.type} · Deals ${u.tx} → <b>${u.pct}%</b>`:'not recorded'}. Enter your own below.</div>
  <div class="row">${KS.map(k=>`<label class="mut">${KL[k]}<br><select id="f${i}_${k}" onchange="pv(${i})">${k=='txDiff'?Object.entries(Q.dealsScore).map(([t,v])=>`<option value="${v}">${esc(t)}</option>`).join(''):nopt(Q.scale[k],df[k]||Q.scale[k])}</select></label>`).join('')}
  <input id="f${i}_c" placeholder="Feedback"><span id="pv${i}"></span><button class="b g" onclick="rs(${i})">Submit</button><button class="b" onclick="run('releaseReview',{id:R[${i}].id},'Released back to the pool')">Release</button></div>`};
 $('c').innerHTML=`<div class="top"><div><h1>Review Pipeline</h1><div class="sub">Completed updates for your region(s). Pick one to review it. You can't pick your own work.</div></div>${regionBar()}</div>
 <h3>Available to pick (${d.pool.length})</h3>`+tbl(['Asset','Region','Updated by','Updater reading','Waiting since','CMS',''],d.pool.map(a=>{const i=ref(a);return `<tr><td>${meta(a)}</td><td>${rg(a)}</td><td>${esc(a.assignee)}</td><td>${a.updReading?a.updReading.pct+'%':'-'}</td><td>${esc(a.completedAt)}</td><td>${cms(a)}</td>
 <td><button class="b p" onclick="run('pickReview',{id:R[${i}].id},'Picked: now yours to review')">Pick</button>${adm?` <select id="as${i}">${d.reviewers.filter(r=>r.isAdmin||r.regions.includes(a.region)).map(r=>`<option>${esc(r.name)}</option>`).join('')}</select><button class="b" onclick="ar(${i})">Assign</button>`:''}</td></tr>`}))+
 `<h3>In review (${d.claimed.length})</h3>`+tbl(['Asset','Region','Updated by','Reviewer','CMS','Score it'],d.claimed.map(a=>`<tr><td>${meta(a)}</td><td>${rg(a)}</td><td>${esc(a.assignee)}</td><td>${esc(a.reviewer)}</td><td>${cms(a)}</td><td>${form(a)}</td></tr>`))+
 `<h3>Completed reviews</h3>`+tbl(['Asset','Region','Updated by','Reviewer','Difficulty: updater vs reviewer','QA %'],d.done.map(a=>`<tr><td>${meta(a)}</td><td>${rg(a)}</td><td>${esc(a.assignee)}</td><td>${esc(a.reviewer)}</td><td>${a.updReading?a.updReading.pct+'%':'-'} vs ${a.reviewReading?a.reviewReading.pct+'%':'-'}</td><td><b>${a.percentage}%</b></td></tr>`));
 R.forEach((o,i)=>{if(o&&o.id&&$('f'+i+'_ownDiff'))pv(i)})},
async search(){const f=window.SF||{},d=await call('search',{...f,region:f.region??REG}),opts=(a,v)=>`<option value="">Any</option>${a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}`;
 $('c').innerHTML=`<h1>Search</h1><div class="sub">${ME.isAdmin?'Everything, all regions.':'Your region(s) only.'} Searches asset ID, name${ME.isAdmin?', notes and people':''}.</div>
 <div class="panel"><div class="row"><input id="sq" placeholder="Search…" value="${esc(f.q||'')}" size=30 onkeydown="if(event.key==='Enter')sgo()"><select id="sr">${opts(ME.regions,f.region)}</select><select id="ss">${opts(['Available','Assigned','In Progress','Pending Review','Reviewed'],f.status)}</select>
 <select id="so">${opts(CFG.ownershipOrder,f.ownership)}</select><select id="sp">${opts(['Full','Limited','Minimal'],f.profileType)}</select>${ME.isAdmin?`<input id="sw" placeholder="Person" value="${esc(f.person||'')}" size=12>`:''}</div>
 <div class="row"><select id="sdf"><option value="requestDate">Request date</option><option value="completedAt" ${f.dateField==='completedAt'?'selected':''}>Updated date</option><option value="reviewDate" ${f.dateField==='reviewDate'?'selected':''}>Reviewed date</option></select>
 <input type="date" id="sd1" value="${f.dateFrom||''}"><input type="date" id="sd2" value="${f.dateTo||''}"><button class="b p" onclick="sgo()">Search</button><button class="b" onclick="window.SF={};show('search')">Clear</button></div></div>
 <div class="cards">${card('Matches',d.total)}${Object.entries(d.byStatus).map(([k,v])=>card(k,v)).join('')}</div><div class="mut" style="margin-bottom:8px">By region: ${Object.entries(d.byRegion).map(([k,v])=>`<span class="tag">${esc(k)} ${v}</span>`).join('')||'-'}</div>`+
 tbl(['Asset','Region','Status','Updated by','Reviewed by','Updated','QA','CMS'],d.items.map(a=>`<tr><td>${meta(a)}</td><td>${rg(a)}</td><td><span class="tag o">${esc(a.status)}</span></td><td>${esc(a.assignee)}</td><td>${esc(a.reviewer)}</td><td>${esc(a.completedAt)}</td><td>${a.percentage!==''?a.percentage+'%':''}</td><td>${cms(a)}</td></tr>`))+
 `<div class="row"><span class="mut">Showing ${d.total?d.offset+1:0}–${Math.min(d.total,d.offset+d.items.length)} of ${d.total}</span>${d.offset>0?`<button class="b" onclick="spg(${d.offset-50})">Previous</button>`:''}${d.offset+50<d.total?`<button class="b" onclick="spg(${d.offset+50})">Next</button>`:''}</div>`},
async kpi(){const per=window.KP||'week',d=await call('kpi',{period:per});
 $('c').innerHTML=`<div class="top"><div><h1>KPI Tracking</h1><div class="sub">${ME.isAdmin?'Team output':'Your output'} since ${esc(d.since.slice(0,10))}.</div></div><select onchange="KP=this.value;show('kpi')"><option value="week" ${per=='week'?'selected':''}>This week</option><option value="month" ${per=='month'?'selected':''}>This month</option></select></div>
 <div class="cards">${card('Profiles updated',d.totals.updated)}${card('Profiles reviewed',d.totals.reviewed)}${card('Active pipeline',d.totals.active)}${card('Queue available',d.totals.available)}</div>`+
 tbl(['Name','Role','Updated','Reviewed','Projects','Pipeline'],d.rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.role)}</td><td><b>${r.updated}</b></td><td><b>${r.reviewed}</b></td><td>${r.projects}</td><td>${r.active}/${r.max}</td></tr>`))+
 (ME.isAdmin?`<div class="g2"><div class="panel"><b>Updated</b><br><br>${bars(d.rows.map(r=>({label:r.name,value:r.updated})))}</div><div class="panel"><b>Reviewed</b><br><br>${bars(d.rows.filter(r=>r.reviewed).map(r=>({label:r.name,value:r.reviewed,color:'#17a36b'})),'No reviews completed in this period.')}</div></div>`:'')},
async quality(){const d=await call('quality');
 $('c').innerHTML=`<h1>Quality Tracking</h1><div class="sub">QA % = difficulty-weighted score from reviews (set in Settings). 85%+ Outstanding · 70–84% Needs attention · below 70% Critical.</div>
 <div class="cards">${card('Team QA average',d.teamAvg==null?'-':d.teamAvg+'%')}${card('Reviews in period',d.reviews)}</div>`+
 tbl(['Name','Reviews','QA %','Avg difficulty %','Band'],d.rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.reviews}</td><td><b>${r.qa==null?'-':r.qa+'%'}</b></td><td>${r.difficulty==null?'-':r.difficulty+'%'}</td><td>${r.qa==null?'':`<span class="tag ${r.qa>=85?'o':r.qa>=70?'w':'r'}">${r.qa>=85?'Outstanding':r.qa>=70?'Needs attention':'Critical'}</span>`}</td></tr>`))+
 `<div class="panel"><b>QA % by person</b><br><br>${bars(d.rows.filter(r=>r.qa!=null).map(r=>({label:r.name,value:r.qa,max:100,text:r.qa+'%',color:qc(r.qa)})),'No reviews yet.')}</div>`},
async over(){const d=await call('overview'),b=d.bottlenecks;
 $('c').innerHTML=`<h1>Manager Overview</h1><div class="sub">Live workload, output, quality and bottlenecks.</div>
 <div class="cards">${card('Queue available',b.available)}${card('Awaiting review',b.pendingReview)}${card('Reviewed today',b.reviewedToday)}${card('Assigned > '+b.overdueHours+'h',`<span style="color:${b.assignedOver?'#d64545':'inherit'}">${b.assignedOver}</span>`)}${card('Review wait > '+b.reviewSlaHours+'h',`<span style="color:${b.reviewOver?'#d64545':'inherit'}">${b.reviewOver}</span>`)}${card('Team QA (week)',d.teamAvg==null?'-':d.teamAvg+'%')}</div>
 <div class="g2"><div class="panel"><b>Workload</b><br><br>${bars(d.workload.map(w=>({label:w.name,value:w.active,max:w.max,text:w.active+'/'+w.max,color:w.active>=w.max?'#d64545':w.active===0?'#b8c0cc':'#2f76e8'})))}</div>
 <div class="panel"><b>Updates this week</b><br><br>${bars(d.output.map(o=>({label:o.name,value:o.updated})))}</div>
 <div class="panel"><b>QA average this week</b><br><br>${bars(d.qa.map(q=>({label:q.name,value:q.qa||0,max:100,text:q.qa+'%',color:qc(q.qa)})),'No reviews this week.')}</div>
 <div class="panel"><b>Last 14 days</b><br><br>${trend(d.trend)}</div></div>
 <div class="panel"><b>No completed update yet today:</b> ${d.noOutputToday.length?d.noOutputToday.map(esc).join(', '):'everyone has output'}</div>`},
async proj(){const d=await call('projectList'),adm=ME.isAdmin;
 $('c').innerHTML=`<h1>Projects</h1><div class="sub">${adm?'Separate project work. It does not count towards the pipeline limit.':'Project items assigned to you.'}</div><div class="cards">${Object.entries(d.counts).map(([k,v])=>card(k,v)).join('')}</div>`+
 (adm?`<div class="panel"><b>Import project CSV</b> <span class="mut">Asset ID, Asset, Project, Priority, Request update from</span><br><input type="file" id="pf" accept=".csv"> <button class="b p" onclick="pimp()">Upload</button>
 <hr style="border:0;border-top:1px solid #eef1f6;margin:10px 0"><b>Allocate the oldest items</b><div class="row"><select id="pa_to">${d.members.map(m=>`<option>${esc(m)}</option>`).join('')}</select><input id="pa_n" type="number" value="5" min="1" style="width:70px"><input id="pa_p" placeholder="project (optional)"><button class="b p" onclick="palloc()">Allocate</button></div></div>`:'')+
 tbl(['Item','Project','Priority','Status','Assigned to',''],d.items.map(x=>{const i=ref(x),mine=x.assignee===ME.name;return `<tr><td><b>${esc(x.name)}</b><br><span class="mut">${esc(x.id)} · requested ${esc(x.requestDate)||'n/a'}</span></td><td>${esc(x.project)}</td><td>${esc(x.priority)}</td><td><span class="tag o">${esc(x.status)}</span></td><td>${esc(x.assignee)||'—'}</td>
 <td>${adm&&x.status==='Available'?`<select id="pas${i}">${d.members.map(m=>`<option>${esc(m)}</option>`).join('')}</select><button class="b" onclick="pas(${i})">Assign</button>`:''}${mine&&x.status==='Assigned'?`<button class="b" onclick="run('projectStart',{pid:R[${i}].pid})">Start</button> `:''}${mine&&(x.status==='Assigned'||x.status==='In Progress')?`<button class="b g" onclick="run('projectComplete',{pid:R[${i}].pid},'Done')">Complete</button>`:''}</td></tr>`}))},
async leave(){const d=await call('leaveView',{week:window.WK}),adm=ME.isAdmin;window.WK=d.week;

let TROWS=null;
function tpv(){const f=$('tf').files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{const Rw=parseCsv(rd.result),H=Rw[0].map(x=>x.trim().toLowerCase().replace(/\s+/g,' '));
 const find=a=>H.findIndex(h=>a.includes(h)),ix={name:find(['name','full name']),email:find(['email','email address','e-mail']),roles:find(['assigned roles','assigned role','roles','role']),region:find(['region','regions','home region']),eligibility:find(['eligibility','eligibilities'])};
 if(ix.name<0||ix.email<0||ix.roles<0){$('tp').innerHTML='<div class="warn">Missing required column(s). Expected: Name, Email, Assigned Roles, Region, Eligibility.</div>';return}
 TROWS=Rw.slice(1).map(c=>{if(ix.eligibility===H.length-1&&c.length>H.length)c=[...c.slice(0,H.length-1),c.slice(H.length-1).map(x=>x.trim()).filter(Boolean).join(', ')];const g=k=>ix[k]<0?undefined:(c[ix[k]]||'').trim();return{name:g('name'),email:g('email'),roles:g('roles'),region:g('region'),eligibility:g('eligibility')}});
 try{const pv=await call('previewTeamImport',{rows:TROWS}),ok=pv.filter(x=>x.action!='error').length;
 $('tp').innerHTML=`<div class="mut" style="margin:8px 0">${pv.length} row(s): ${ok} ready, ${pv.length-ok} with problems (skipped).</div><table><tr><th>Row</th><th>Name</th><th>Email</th><th>Title</th><th>Tags</th><th>Regions</th><th>Profile types</th><th>Result</th></tr>`+
 pv.map(x=>`<tr><td>${x.rowNo}</td><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.title)}</td><td>${x.isReviewer?'<span class="tag w">Reviewer</span>':''}${x.isAdmin?'<span class="tag r">Admin</span>':''}</td><td>${x.regions.map(r=>`<span class="tag">${esc(r)}</span>`).join('')}</td><td>${esc(x.profileTypes)}</td>
 <td><span class="tag ${x.action=='error'?'r':'o'}">${x.action=='add'?'New':x.action=='update'?'Update':'Error'}</span> ${esc(x.message)}</td></tr>`).join('')+`</table><br><button class="b p" ${ok?'':'disabled'} onclick="tim()">Import ${ok} member(s)</button>`}catch(e){$('tp').innerHTML='<div class="warn">'+esc(e.message)+'</div>'}};rd.readAsText(f)}
async function tim(){try{const r=await call('importTeam',{rows:TROWS});toast(`Team import: ${r.added} added, ${r.updated} updated, ${r.errors.length} skipped`);show('team')}catch(e){toast(e.message)}}
const card=(l,v)=>`<div class="card"><div class="l">${l}</div><div class="n">${v}</div></div>`;
const nopt=(n,v)=>Array.from({length:n},(_,i)=>`<option ${i+1==v?'selected':''}>${i+1}</option>`).join('');
const qc=v=>v==null?'#b8c0cc':v>=85?'#17a36b':v>=70?'#e0a100':'#d64545';
const bars=(rows,empty)=>rows.length?rows.map(r=>{const mx=r.max||Math.max(1,...rows.map(x=>x.value));return `<div class="brow"><span class="bl" title="${esc(r.label)}">${esc(r.label)}</span><div class="bt"><i style="width:${Math.min(100,r.value/mx*100)}%;background:${r.color||'#2f76e8'}"></i></div><span class="bv">${esc(r.text??r.value)}</span></div>`}).join(''):`<span class="mut">${empty||'No data.'}</span>`;
function trend(d){const W=640,H=180,P=28,top=Math.max(1,...d.flatMap(x=>[x.updated,x.reviewed])),X=i=>P+i*(W-2*P)/Math.max(1,d.length-1),Y=v=>H-P-v/top*(H-2*P),L=k=>d.map((x,i)=>X(i)+','+Y(x[k])).join(' ');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="Updated and reviewed per day"><polyline points="${L('updated')}" fill="none" stroke="#2f76e8" stroke-width="2.5"/><polyline points="${L('reviewed')}" fill="none" stroke="#17a36b" stroke-width="2.5"/>${d.map((x,i)=>i%2==0?`<text x="${X(i)}" y="${H-8}" font-size="9" text-anchor="middle" fill="#7b8594">${x.day.slice(5)}</text>`:'').join('')}</svg><div class="mut"><span style="color:#2f76e8">■</span> Updated <span style="color:#17a36b">■</span> Reviewed</div>`}
async function hdr(){let n=0;try{n=(await call('notifications',{countOnly:true})).unread}catch(e){}NAVB.notif=n;nav();const st=ME.availability;
 $('hdr').innerHTML=`<label class="mut">Availability <select id="avs" onchange="setAv(this.value)">${['Available','Not available',...(st==='On leave'||ME.isAdmin?['On leave']:[])].map(x=>`<option ${x===st?'selected':''}>${x}</option>`).join('')}</select></label><input id="avn" placeholder="note (optional)" value="${esc(ME.availabilityNote||'')}" size=22>
 ${st!=='Available'?`<span class="tag w">${esc(st)}: no new work</span>`:'<span class="tag o">Taking work</span>'}<span style="flex:1"></span><a href="#" onclick="show('notif');return false" style="text-decoration:none">🔔 Alerts${n?` <span class="tag r">${n}</span>`:''}</a>`}
async function setAv(v){try{await call('setAvailability',{status:v,note:$('avn').value});ME.availability=v;ME.availabilityNote=$('avn').value;toast('Availability: '+v);await hdr();if(page==='dash')show('dash')}catch(e){toast(e.message);hdr()}}
async function mread(){await call('markRead',{});await hdr();show('notif')}
function cp(i){run('complete',{id:R[i].id,ownDiff:$('u'+i+'_ownDiff').value,typeDiff:$('u'+i+'_typeDiff').value,txDiff:$('u'+i+'_txDiff').value},'Sent to the review pipeline')}
function pv(i){const s={};KS.forEach(k=>s[k]=Number($('f'+i+'_'+k).value));const r=calc(window.QAC,s),u=R[i].updReading,diff=u&&(s.ownDiff!==u.own||s.typeDiff!==u.type||s.txDiff!==u.tx);
 $('pv'+i).innerHTML='<b>QA '+r.pct+'% (difficulty '+r.d+'%)</b>'+(u?(diff?` <span class="tag w">differs from updater (${u.pct}%)</span>`:' <span class="tag o">matches updater</span>'):'')}
function sgo(){window.SF={q:$('sq').value,region:$('sr').value,status:$('ss').value,ownership:$('so').value,profileType:$('sp').value,person:$('sw')?$('sw').value:'',dateField:$('sdf').value,dateFrom:$('sd1').value,dateTo:$('sd2').value,offset:0};show('search')}
function spg(n){window.SF={...(window.SF||{}),offset:Math.max(0,n)};show('search')}
function wk(n){const d=new Date(WK+'T00:00:00');d.setDate(d.getDate()+n);WK=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');show('leave')}
function ladd(){run('leaveAdd',{user:$('l_u').value,from:$('l_f').value,to:$('l_t').value,type:$('l_ty').value,note:$('l_n').value},'Leave added')}
function pimp(){const f=$('pf').files[0];if(!f)return toast('Choose a CSV first');const rd=new FileReader();rd.onload=async()=>{const Rw=parseCsv(rd.result),h=Rw[0].map(x=>x.trim().toLowerCase()),ix=n=>h.indexOf(n);
 const rows=Rw.slice(1).filter(r=>r[ix('asset id')]).map(r=>({id:(r[ix('asset id')]||'').trim(),name:(r[ix('asset')]||'').trim(),project:(r[ix('project')]||'').trim(),priority:(r[ix('priority')]||'').trim(),requestDate:(r[ix('request update from')]||'').trim()}));
 const res=await run('projectImport',{rows});if(res)toast(res.added+' added, '+res.dup+' duplicates')};rd.readAsText(f)}
function palloc(){run('projectAllocate',{to:$('pa_to').value,count:$('pa_n').value,project:$('pa_p').value},'Allocated')}
function pas(i){run('projectAssign',{pids:[R[i].pid],to:$('pas'+i).value},'Assigned')}
function wset(i){run('setAvailability',{user:R[i].name,status:$('ws'+i).value,note:$('wn'+i).value},'Status updated')}
function sapply(){window.SQ={from:$('sf').value,to:$('st').value};show('stats')}
function sdays(n){const f=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),t=new Date(),s=new Date();s.setDate(s.getDate()-n+1);window.SQ={from:f(s),to:f(t)};show('stats')}
const xchk=n=>[...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x=>x.value);
const xstate=()=>({filters:{regions:xchk('xr'),statuses:xchk('xs'),ownership:xchk('xo'),profileTypes:xchk('xp'),dateField:$('xdf').value,dateFrom:$('xd1').value,dateTo:$('xd2').value},columns:xchk('xc'),format:$('xf').value,tabPerRegion:$('xt').checked});
function dl(r){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([Uint8Array.from(atob(r.contentBase64),c=>c.charCodeAt(0))],{type:r.mime}));a.download=r.filename;a.click()}
async function xdo(p){try{const r=await call('exportRun',p);dl(r);toast(r.rows+' rows exported');show('exp')}catch(e){toast(e.message)}}
const xrun=()=>xdo(xstate()),xprun=i=>xdo({profileId:XP[i].id});
function xsave(){run('exportSaveProfile',{name:$('xn').value,...xstate()},'Profile saved')}
function xload(i){const p=XP[i],f=p.filters,set=(n,a)=>document.querySelectorAll(`input[name="${n}"]`).forEach(x=>x.checked=(a||[]).includes(x.value));set('xr',f.regions);set('xs',f.statuses);set('xo',f.ownership);set('xp',f.profileTypes);set('xc',p.columns);
 $('xf').value=p.format;$('xt').checked=p.tabPerRegion;$('xdf').value=f.dateField||'requestDate';$('xd1').value=f.dateFrom||'';$('xd2').value=f.dateTo||'';$('xn').value=p.name;toast('Loaded: '+p.name)}
const outp=()=>({profileType:kvp($('o_pt').value),bands:$('o_b').value.split('\n').map(l=>l.split('=')).filter(x=>x[1]!==undefined&&x[0].trim()).map(([u,b])=>({upTo:Number(u),bonus:Number(b)})),reviewWeight:Number($('o_rw').value)});

call('boot').then(async b=>{ME=b.me;CFG=b.cfg;if(ME.isAdmin){try{const g=await call('unassignable');NAVB.gaps=g.totals.gap+g.totals.away}catch(e){}}await hdr();show('dash')}).catch(e=>$('c').innerHTML='<div class="panel">'+esc(e.message||e)+'</div>');
</script></body></html>
